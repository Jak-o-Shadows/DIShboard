<form hx-get="{{ filter_action_url }}"
      hx-target="main"
      hx-push-url="true"
      class="filter-form"
      method="GET"
      id="pdu-filter">

    <style>
        .filter-builder-option {
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            border-left: 4px solid var(--pico-form-element-border-color, #b3b9c4);
            border-radius: 0.5rem;
            background-color: var(--pico-muted-color, #f8f9fa);
        }

        .filter-builder-row-header {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: nowrap;
        }

        .filter-logic-select {
            min-width: 70px;
            flex-shrink: 0;
        }

        .filter-builder-row-body {
            margin-top: 0.5rem;
            margin-left: 1.5rem;
        }
    </style>

    {% include 'forms/pdu_filter_add_partial.html' %}

    <div id="filter-fieldsets">
        {{ active_fieldsets_html|safe }}
    </div>

    <button type="submit" class="primary">Apply Filters</button>
</form>
