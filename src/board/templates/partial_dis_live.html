<main id="dis-live">
    <header>
        <h1>DIS Live Stream</h1>
    </header>
    <section id="dis_ingestion">
        <details>
            <summary role="button" class="secondary">DIS Ingestion</summary>
            {% include 'ingestion_control.html' %}
        </details>
    </section>
    <section id="pdu-filter">
        <details>
            <summary role="button" class="secondary">Filters</summary>
            {% include 'forms/pdu_filter.html' %}
        </details>
    </section>
    <section id="dashboard-grid">
        <section>
            <header>
                <h2>Live PDU Stream</h2>
            </header>
            <section id="pdu-container"
                    hx-get="{% url 'board:pdu_list' %}"
                    hx-trigger="every 5s"
                    hx-swap="innerHTML">
                {% include 'pdus/partial_list.html' %}
            </section>
        </section>
        <section>
            <header>
                <h2>Selected PDU Details</h2>
            </header>
            <section id="detail-panel" class="detail-card">
                <p>Select a row in the left pane to inspect a PDU.</p>
            </section>
        </section>
    </section>
</main>
